# English Language File (EN)
errors:
  no_permission: '§cYou do not have permission to do this.'
  no_console: '§cOnly players can use this command.'
  home_not_set: '§cNo home is set in slot §e%slot%§c.'
  slot_locked: '§cYou cannot use slot §e%slot%§c. Your maximum is §e%max%§c.'
  invalid_slot: '§c"§e%input%§c" is not a valid slot number (1-8).'
  home_not_found: '§cCould not find a home with the name or slot "§e%input%§c".'
  unknown_command: '§cUnknown command: §e%input%§c. Use /homes [set|tp|delete|rename].'
